# token.spacehpc.com 子域名配置
# 放置于 /etc/nginx/conf.d/token.spacehpc.com.conf

log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" '
                '"$http_user_agent" "$http_x_forwarded_for" '
                '$upstream_addr $upstream_response_time $request_time';

access_log /var/log/nginx/ai-gateway-access.log main;
error_log /var/log/nginx/ai-gateway-error.log warn;

upstream inner_nginx {
    server 116.113.100.203:20831 max_fails=3 fail_timeout=30s;  # 联通
    server 218.202.112.58:20831 max_fails=3 fail_timeout=30s;   # 移动
    server 111.127.52.27:20831 max_fails=3 fail_timeout=30s;    # 电信
    keepalive 32;
}

# HTTP 80 重定向到 HTTPS 443
server {
    listen 80;
    server_name token.spacehpc.com;

    # IP 白名单
    allow 127.0.0.1;
    # allow 你的办公IP;
    # allow 其他允许的IP;
    deny all;

    return 301 https://$server_name$request_uri;
}

# HTTPS 443 服务
server {
    listen 443 ssl http2;
    server_name token.spacehpc.com;

    # IP 白名单（允许的IP，最后 deny all）
    allow 127.0.0.1;
    # allow 你的办公IP;
    # allow 其他允许的IP;
    deny all;

    # SSL 证书配置
    ssl_certificate /etc/nginx/ssl/spacehpc.com/spacehpc.com.pem;
    ssl_certificate_key /etc/nginx/ssl/spacehpc.com/spacehpc.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://inner_nginx;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }
}
